<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     fill="none">

  <!-- Farbe: #ffffff, Zentrum: exakt (512, 512) -->

  <!-- ========================================== -->
  <!-- 1. DIE TAUCHFLASCHE (Körper) -->
  <!-- ========================================== -->
  
  <!-- Komplette Flasche als Kontur (umfasst nun den gesamten Körper bis unten) -->
  <path fill="none" stroke="#ffffff" stroke-width="40" stroke-linejoin="round"
        d="M 390 780
           L 390 370
           C 390 270 440 220 512 220
           C 584 220 634 270 634 370
           L 634 780
           C 634 820 609 840 574 840
           L 450 840
           C 415 840 390 820 390 780
           Z"/>

   <!-- ========================================== -->
  <!-- 2. VENTIL & ANSCHLUSS (Oben) -->
  <!-- ========================================== -->
  
  <!-- Ventil-Sockel -->
  <rect fill="#ffffff" x="475" y="180" width="74" height="40" rx="4"/>
  <rect fill="#ffffff" x="485" y="140" width="54" height="60" rx="6"/>
  
  <!-- Ventil-Gehäuse (Querbalken) -->
  <rect fill="#ffffff" x="440" y="120" width="144" height="44" rx="4"/>
  
  <!-- Ventil-Rad (Querbalken) -->
  <rect fill="#ffffff" x="360" y="100" width="86" height="84" rx="4"/>
  
  <!-- Ventil-Rädchen (Oben) -->
  <rect fill="#ffffff" x="485" y="105" width="54" height="45" rx="6"/>

  <!-- ========================================== -->
  <!-- 3. DAS NOCH GRÖSSERE, FARBIGE "i" (Information) -->
  <!-- ========================================== -->
  
  <!-- Punkt über dem i (vergrößert auf r=45) -->
  <circle fill="#ffffff" cx="512" cy="420" r="65"/>
  
  <!-- Vertikaler Balken des i (vergrößert auf 96x210) -->
  <rect fill="#ffffff" x="455" y="505" width="120" height="210" rx="20"/>

 

</svg>