  <title id="title">Zwei versetzt angeordnete Taucher</title>
  <desc id="desc">Zwei stilisierte Taucherbüsten mit runden Köpfen und durchgehenden silbergrauen Tauchmasken. Der kleinere Taucher steht links hinten, der größere rechts vorne und überdeckt einen Teil der hinteren Figur. Transparenter Hintergrund.</desc>
