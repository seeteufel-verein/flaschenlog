<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1024 1024"
     width="1024" height="1024"
     fill="none">

  <!-- Farbe: #ffffff, Zentrum: exakt (512, 512) -->

  <!-- ========================================== -->
  <!-- 1. DIE TAUCHFLASCHE (Körper) -->
  <!-- ========================================== -->
  
  <!-- Komplette Flasche als Kontur (umfasst nun den gesamten Körper bis unten) -->
  <path fill="none" stroke="#ffffff" stroke-width="40" stroke-linejoin="round"
        d="M 390 780
           L 390 370
           C 390 270 440 220 512 220
           C 584 220 634 270 634 370
           L 634 780
           C 634 820 609 840 574 840
           L 450 840
           C 415 840 390 820 390 780
           Z"/>

  <!-- Unterer Teil: Gefüllt (Halbvoll) -->
  <!-- Beginnt exakt auf der Höhe der Fülllinie (y=560) und füllt den unteren Bereich -->
  <path fill="#ffffff"
        d="M 390 560
           L 390 780
           C 390 820 415 840 450 840
           L 574 840
           C 609 840 634 820 634 780
           L 634 560
           Z"/>

  <!-- ========================================== -->
  <!-- 2. VENTIL & ANSCHLUSS (Oben) -->
  <!-- ========================================== -->
  
  <!-- Ventil-Sockel -->
  <rect fill="#ffffff" x="475" y="180" width="74" height="40" rx="4"/>
  <rect fill="#ffffff" x="485" y="140" width="54" height="60" rx="6"/>
  
  <!-- Ventil-Gehäuse (Querbalken) -->
  <rect fill="#ffffff" x="440" y="120" width="144" height="44" rx="4"/>
  
  <!-- Ventil-Rad (Querbalken) -->
  <rect fill="#ffffff" x="360" y="100" width="86" height="84" rx="4"/>
  
  <!-- Ventil-Rädchen (Oben) -->
  <rect fill="#ffffff" x="485" y="105" width="54" height="45" rx="6"/>

  <!-- ========================================== -->
  <!-- 3. SCHLAUCH & ANSCHLUSS (Rechts) -->
  <!-- ========================================== -->

  <!-- Schlauch-Verbindung am Ventil -->
  <rect fill="#ffffff" x="575" y="125" width="40" height="34" rx="2"/>

  <!-- Längerer Schlauch -->
  <rect fill="#ffffff" x="575" y="132" width="200" height="20" rx="2"/>
  <rect fill="#ffffff" x="775" y="132" width="20" height="160" rx="2"/>

  <!-- Größeres, komplett gefülltes Schlauch-Anschlussstück -->
  <!-- Hauptblock (Negativraum entfernt, komplett gefüllt) -->
  <rect fill="#ffffff" x="765" y="270" width="45" height="40" rx="6"/>
  <!-- Stecker-Verbindung -->
  <rect fill="#ffffff" x="810" y="282" width="15" height="16" rx="2"/>
  <rect fill="#ffffff" x="825" y="286" width="20" height="8" rx="2"/>
  <rect fill="#ffffff" x="845" y="284" width="10" height="12" rx="2"/>

</svg>